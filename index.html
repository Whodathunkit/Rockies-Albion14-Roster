    <title>Rockies Albion 14 Team Roster & Match Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom colors from the logo */
        .bg-rockies-blue { background-color: #003C71; }
        .text-rockies-blue { color: #003C71; }
        .border-rockies-blue { border-color: #003C71; }

        /* 3D Card Flip & Expand Modal Animation */
        .perspective-1000 {
            perspective: 1200px;
        }
        .flip-card-inner {
            transition: transform 0.65s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flipped {
            transform: rotateY(180deg);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        @keyframes modalPop {
            0% { transform: scale(0.75) rotateY(-90deg); opacity: 0; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }
        .animate-card-flip-open {
            animation: modalPop 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen pb-16">

    <div class="container mx-auto px-4 py-6 md:py-10 max-w-7xl">

            <!-- Scoreboard & Match Timer Card -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl">
                <!-- Half / Period & Opponent Name Row -->
                <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-zinc-800">

                <!-- Live Scoreboard & Quick Action Buttons -->
                <div class="grid grid-cols-2 gap-4 sm:gap-8 pt-6 border-t border-zinc-800">

                    <div class="bg-rockies-blue/25 border border-rockies-blue rounded-2xl p-4 sm:p-6 text-center flex flex-col justify-between">

    <!-- MODAL 1: RECORD ROCKIES GOAL + ASSIST -->

    <!-- MODAL 2: FULL-PAGE 3D FLIPPED PLAYER STATS & HIGHLIGHT VIDEO CARD -->

    <!-- Custom Confirmation Modal (No browser alert/confirm) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

    <script>
        // --- ROSTER DATA ---
        // Data provided directly by you for 100% accuracy.
        // Optional 6th column 'Highlight URL' can be added anytime if you have a specific MP4 or GIF link for a player!
        const csvData = `Jersey Number,Player Name,Parent 1,Parent 2,Position
3,Nael Salazar Simon,Paulina,Armando,GK
4,Logan Martens,Tyler,Rosie,Defense
5,Elijah Amoako,Franklin,Linda,Striker
11,Tristan D'Mello,Melvin,Charlotte,Winger/Striker
62,Elnathan Udoh,Emmanuel,Dépéjú,Defense/Midfield
14,Haaris Nathoo,Rizwan,Rabea,GK
22,Yazed Manasrah,,,Defense/Midfield
35,Nyle Zachary,,,Midfield
52,Sam Campbell,,,Defense
58,Harrison Locke,,,Midfield
65,Nicholas Lai,,,Defense
70,Esteban Bazurto,,,Striker`;

        // --- IN-MEMORY APP STATE ---
        let rosterPlayers = [];
        let playerStats = {}; // Keyed by jersey number: { goals: 0, assists: 0, highlightUrl: '' }
        
        // Match state
        let matchState = {
            usScore: 0,
            themScore: 0,
            opponentName: 'Opponent',
            period: '1st Half',
            secondsElapsed: 0,
            isRunning: false,
            timerInterval: null,
            events: [] // { id, timeStr, period, type: 'us'|'them', scorerJersey, assistJersey, text }
        };

        let activeModalJersey = null;

        /**
         * Parses the raw CSV string data into an array of player objects.
         */
        function parseCSV(csvString) {
            const lines = csvString.trim().split('\n');
            if (lines.length < 2) return [];

            const headers = lines[0].split(',').map(h => h.trim());
            const roster = [];

            const jerseyIndex = headers.indexOf('Jersey Number');
            const nameIndex = headers.indexOf('Player Name');
            const parent1Index = headers.indexOf('Parent 1');
            const parent2Index = headers.indexOf('Parent 2');
            const positionIndex = headers.indexOf('Position');

            if (jerseyIndex === -1 || nameIndex === -1 || parent1Index === -1) {
                console.error("CSV headers are missing or incorrect.");
                return [];
            }

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                if (values.length < headers.length - 2) continue;

                const jersey = parseInt(values[jerseyIndex], 10);
                const name = (values[nameIndex] || '').trim();
                const parent1 = (values[parent1Index] || '').trim();
                const parent2 = (values[parent2Index] || '').trim();
                const position = (values[positionIndex] || '').trim();

                let parents = parent1;
                if (parent1 && parent2) {
                    parents = `${parent1} & ${parent2}`;
                } else if (parent2) {
                    parents = parent2;
                }

                if (name && !isNaN(jersey)) {
                    roster.push({ jersey, name, position, parents });
                    if (!playerStats[jersey]) {
                        playerStats[jersey] = {
                            goals: 0,
                            assists: 0,
                            highlightUrl: ''
                        };
                    }
                }
            }
            return roster.sort((a, b) => a.jersey - b.jersey);
        }

        function displayRoster() {
            const rosterGrid = document.getElementById('roster-grid');
            if (!rosterGrid) return;

            let rosterHTML = '';
            rosterPlayers.forEach(player => {
                const position = player.position || 'N/A';
                const stats = playerStats[player.jersey] || { goals: 0, assists: 0 };
                const points = stats.goals + stats.assists;

                rosterHTML += `
                    <div onclick="openPlayerCard(${player.jersey})" 
                         class="group bg-white text-gray-900 rounded-2xl shadow-lg overflow-hidden cursor-pointer transform hover:-translate-y-1.5 hover:shadow-2xl transition-all duration-300 border-2 border-transparent hover:border-blue-500 flex flex-col justify-between">
                        <div class="p-6">
                            <div class="flex items-start justify-between">
                                <div class="flex-grow pr-4">
                                    <h2 class="text-2xl font-bold text-gray-800 group-hover:text-rockies-blue transition-colors">${player.name}</h2>
                                    <p class="text-sm font-semibold text-gray-500 uppercase tracking-wide mt-1">${position}</p>
                                </div>
                                <div class="flex-shrink-0 w-14 h-14 flex items-center justify-center bg-rockies-blue rounded-full shadow-md group-hover:scale-110 transition-transform">
                                    <span class="text-2xl font-bold text-white">${player.jersey}</span>
                                </div>
                            </div>

                            <!-- Quick Stats Pill Row -->
                            <div class="mt-4 flex items-center space-x-2">
                                <span class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold">
                                    ⚽ Goals: ${stats.goals}
                                </span>
                                <span class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold">
                                    👟 Assists: ${stats.assists}
                                </span>
                                <span class="px-2.5 py-1 bg-blue-50 text-rockies-blue rounded-lg text-xs font-bold">
                                    ⭐ Pts: ${points}
                                </span>
                            </div>

                            <div class="mt-4 pt-4 border-t border-gray-200 flex items-center justify-between">
                                <div class="flex items-center text-gray-600">
                                    <svg class="w-5 h-5 mr-2 flex-shrink-0 text-rockies-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                    </svg>
                                    <span class="text-sm font-medium">${player.parents || 'N/A'}</span>
                                </div>
                                <span class="text-xs font-bold text-rockies-blue group-hover:translate-x-1 transition-transform">
                                    Flip Card ↻
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            });
            rosterGrid.innerHTML = rosterHTML;

            // Update top summary badge
            const totalTeamGoals = Object.values(playerStats).reduce((sum, s) => sum + s.goals, 0);
            document.getElementById('badge-team-goals').textContent = totalTeamGoals;
            document.getElementById('badge-opp-goals').textContent = matchState.themScore;
        }

        /**
         * Opens the 3D Flipped Full-Page Player Modal with Highlight Video/GIF and Stats
         */
        function openPlayerCard(jersey) {
            const player = rosterPlayers.find(p => p.jersey === jersey);
            if (!player) return;

            activeModalJersey = jersey;
            const stats = playerStats[jersey] || { goals: 0, assists: 0, highlightUrl: '' };
            const totalPoints = stats.goals + stats.assists;

            // Filter match events involving this player
            const playerEvents = matchState.events.filter(
                e => e.type === 'us' && (e.scorerJersey === jersey || e.assistJersey === jersey)
            );

            // Determine media header (custom MP4/GIF if set, or animated soccer stadium highlight banner)
            let mediaBannerHTML = '';
            if (stats.highlightUrl) {
                const isVideo = stats.highlightUrl.match(/\.(mp4|webm|ogg)$/i);
                if (isVideo) {
                    mediaBannerHTML = `
                        <video src="${stats.highlightUrl}" autoplay loop muted playsinline class="w-full h-56 sm:h-72 object-cover bg-black"></video>
                    `;
                } else {
                    mediaBannerHTML = `
                        <img src="${stats.highlightUrl}" alt="${player.name} Highlight" class="w-full h-56 sm:h-72 object-cover bg-black" />
                    `;
                }
            } else {
                // Default animated SVG Soccer Highlight Action Banner
                mediaBannerHTML = `
                    <div class="w-full h-56 sm:h-64 bg-gradient-to-br from-rockies-blue via-blue-950 to-zinc-950 relative overflow-hidden flex flex-col items-center justify-center p-6 text-center">
                        <!-- Pitch lines background SVG -->
                        <svg class="absolute inset-0 w-full h-full opacity-15" viewBox="0 0 400 200" fill="none" stroke="white" stroke-width="2">
                            <rect x="10" y="10" width="380" height="180" rx="4"/>
                            <line x1="200" y1="10" x2="200" y2="190"/>
                            <circle cx="200" cy="100" r="35"/>
                            <rect x="10" y="55" width="55" height="90"/>
                            <rect x="335" y="55" width="55" height="90"/>
                        </svg>
                        <img src="https://rockiessoccer.ca/wp-content/uploads/2023/02/Calgary-Rockies-FC-Royal-Blue-Medium.png" alt="Rockies Logo" class="h-16 w-auto mb-2 relative z-10 drop-shadow-lg animate-pulse" />
                        <span class="px-3 py-1 rounded-full bg-white/10 border border-white/20 text-xs font-bold uppercase tracking-widest text-blue-200 relative z-10">
                            🎥 Player Highlight Reel
                        </span>
                        <p class="text-xs text-gray-300 mt-1.5 max-w-md relative z-10">
                            Paste a link to ${player.name.split(' ')[0]}'s GIF or MP4 clip below to showcase their action highlight at the top of their card!
                        </p>
                    </div>
                `;
            }

            const modalCard = document.getElementById('player-modal-card');
            modalCard.innerHTML = `
                <!-- Top Highlight Video / GIF Area -->
                <div class="relative">
                    ${mediaBannerHTML}
                    <button onclick="closePlayerModal()" class="absolute top-3 right-3 w-10 h-10 rounded-full bg-black/70 hover:bg-black text-white flex items-center justify-center text-2xl font-bold border border-white/20 shadow-lg transition">
                        &times;
                    </button>
                    <div class="absolute bottom-3 left-4 flex items-center space-x-3 bg-black/75 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/15">
                        <div class="w-12 h-12 rounded-full bg-rockies-blue flex items-center justify-center border-2 border-white font-extrabold text-xl text-white">
                            #${player.jersey}
                        </div>
                        <div>
                            <h2 class="text-xl sm:text-2xl font-extrabold text-white leading-tight">${player.name}</h2>
                            <p class="text-xs font-bold uppercase tracking-wider text-blue-300">${player.position || 'N/A'} • Parents: ${player.parents || 'N/A'}</p>
                        </div>
                    </div>
                </div>

                <!-- Player Stats Body -->
                <div class="p-6 space-y-6">
                    <!-- Big Stat Counters with Quick +/- Controls -->
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="text-xs font-bold uppercase tracking-widest text-gray-400">Season & Match Statistics</h3>
                            <span class="text-xs text-gray-400">Tap + / - to adjust anytime</span>
                        </div>
                        <div class="grid grid-cols-3 gap-3 sm:gap-4">
                            <!-- Goals Box -->
                            <div class="bg-zinc-800/90 border border-zinc-700 rounded-2xl p-4 text-center">
                                <span class="text-xs font-bold uppercase tracking-wider text-gray-400">⚽ Goals</span>
                                <div class="text-4xl sm:text-5xl font-extrabold text-white my-2">${stats.goals}</div>
                                <div class="flex justify-center space-x-2 mt-2">
                                    <button onclick="adjustPlayerStat(${player.jersey}, 'goals', -1)" class="w-8 h-8 rounded-lg bg-zinc-700 hover:bg-zinc-600 text-white font-bold text-sm">-</button>
                                    <button onclick="adjustPlayerStat(${player.jersey}, 'goals', 1)" class="w-8 h-8 rounded-lg bg-rockies-blue hover:bg-blue-600 text-white font-bold text-sm">+</button>
                                </div>
                            </div>

                            <!-- Assists Box -->
                            <div class="bg-zinc-800/90 border border-zinc-700 rounded-2xl p-4 text-center">
                                <span class="text-xs font-bold uppercase tracking-wider text-gray-400">👟 Assists</span>
                                <div class="text-4xl sm:text-5xl font-extrabold text-white my-2">${stats.assists}</div>
                                <div class="flex justify-center space-x-2 mt-2">
                                    <button onclick="adjustPlayerStat(${player.jersey}, 'assists', -1)" class="w-8 h-8 rounded-lg bg-zinc-700 hover:bg-zinc-600 text-white font-bold text-sm">-</button>
                                    <button onclick="adjustPlayerStat(${player.jersey}, 'assists', 1)" class="w-8 h-8 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm">+</button>
                                </div>
                            </div>

                            <!-- Total Contributions Box -->
                            <div class="bg-rockies-blue/30 border border-rockies-blue rounded-2xl p-4 text-center flex flex-col justify-center">
                                <span class="text-xs font-bold uppercase tracking-wider text-blue-200">⭐ Total Points</span>
                                <div class="text-4xl sm:text-5xl font-extrabold text-white my-2">${totalPoints}</div>
                                <span class="text-[11px] text-blue-300 font-medium">Goals + Assists</span>
                            </div>
                        </div>
                    </div>

                    <!-- Match Log for this Player -->
                    <div class="bg-zinc-950/70 border border-zinc-800 rounded-xl p-4">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Recent Match Contributions</h4>
                        ${playerEvents.length === 0 
                            ? `<p class="text-xs text-gray-500 italic">No match goals or assists logged in the current session yet.</p>`
                            : `<ul class="space-y-1.5 text-xs text-gray-200">
                                ${playerEvents.map(ev => `<li class="flex items-center justify-between py-1 border-b border-zinc-800/80 last:border-none">
                                    <span>${ev.text}</span>
                                    <span class="text-blue-400 font-mono font-bold">${ev.timeStr} (${ev.period})</span>
                                </li>`).join('')}
                               </ul>`
                        }
                    </div>

                    <!-- Custom Highlight Video / GIF URL Input -->
                    <div class="pt-2 border-t border-zinc-800">
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">
                            🎬 Highlight Video (.mp4) or GIF Link
                        </label>
                        <div class="flex space-x-2">
                            <input id="highlight-url-input" type="url" value="${stats.highlightUrl || ''}" 
                                placeholder="https://example.com/player-highlight.gif or .mp4"
                                class="flex-1 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-blue-500" />
                            <button onclick="savePlayerHighlight(${player.jersey})" class="px-4 py-2 bg-rockies-blue hover:bg-blue-600 text-white font-bold rounded-xl text-xs sm:text-sm transition">
                                Set Media
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('player-modal').classList.remove('hidden');
        }

        function closePlayerModal() {
            document.getElementById('player-modal').classList.add('hidden');
            activeModalJersey = null;
        }

        function handleBackdropClick(event) {
            if (event.target.id === 'player-modal') {
                closePlayerModal();
            }
        }

        function adjustPlayerStat(jersey, field, delta) {
            if (!playerStats[jersey]) return;
            playerStats[jersey][field] = Math.max(0, playerStats[jersey][field] + delta);
            displayRoster();
            if (activeModalJersey === jersey) {
                openPlayerCard(jersey);
            }
        }

        function savePlayerHighlight(jersey) {
            const input = document.getElementById('highlight-url-input');
            if (!input || !playerStats[jersey]) return;
            playerStats[jersey].highlightUrl = input.value.trim();
            openPlayerCard(jersey);
        }

        function switchTab(tab) {
            const rosterView = document.getElementById('view-roster');
            const trackerView = document.getElementById('view-tracker');
            const tabRosterBtn = document.getElementById('tab-roster');
            const tabTrackerBtn = document.getElementById('tab-tracker');

            if (tab === 'roster') {
                rosterView.classList.remove('hidden');
                trackerView.classList.add('hidden');
                tabRosterBtn.className = 'px-5 py-2.5 rounded-lg text-sm md:text-base font-bold transition-all bg-white text-rockies-blue shadow';
                tabTrackerBtn.className = 'px-5 py-2.5 rounded-lg text-sm md:text-base font-bold transition-all text-gray-200 hover:text-white';
                displayRoster();
            } else {
                rosterView.classList.add('hidden');
                trackerView.classList.remove('hidden');
                tabTrackerBtn.className = 'px-5 py-2.5 rounded-lg text-sm md:text-base font-bold transition-all bg-white text-rockies-blue shadow';
                tabRosterBtn.className = 'px-5 py-2.5 rounded-lg text-sm md:text-base font-bold transition-all text-gray-200 hover:text-white';
                renderMatchTracker();
            }
        }

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateClockUI() {
            document.getElementById('clock-display').textContent = formatTime(matchState.secondsElapsed);
            const btn = document.getElementById('btn-start-pause');
            if (matchState.isRunning) {
                btn.textContent = '⏸ Pause Clock';
                btn.className = 'px-6 py-2.5 rounded-xl font-bold text-sm sm:text-base bg-amber-500 hover:bg-amber-400 text-black shadow-lg transition transform active:scale-95';
            } else {
                btn.textContent = '▶ Start Clock';
                btn.className = 'px-6 py-2.5 rounded-xl font-bold text-sm sm:text-base bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition transform active:scale-95';
            }
        }

        function toggleTimer() {
            if (matchState.isRunning) {
                clearInterval(matchState.timerInterval);
                matchState.isRunning = false;
            } else {
                matchState.isRunning = true;
                matchState.timerInterval = setInterval(() => {
                    matchState.secondsElapsed++;
                    updateClockUI();
                }, 1000);
            }
            updateClockUI();
        }

        function adjustClock(deltaSeconds) {
            matchState.secondsElapsed = Math.max(0, matchState.secondsElapsed + deltaSeconds);
            updateClockUI();
        }

        function setPeriod(periodName) {
            matchState.period = periodName;
            document.getElementById('period-label').textContent = periodName;
            const p1 = document.getElementById('period-1');
            const p2 = document.getElementById('period-2');
            if (periodName === '1st Half') {
                p1.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-rockies-blue text-white';
                p2.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-zinc-800 text-gray-400 hover:text-white';
            } else {
                p2.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-rockies-blue text-white';
                p1.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-zinc-800 text-gray-400 hover:text-white';
            }
        }

        function updateOpponentName(name) {
            matchState.opponentName = name.trim() || 'Opponent';
            document.getElementById('score-them-label').textContent = matchState.opponentName;
        }

        function openGoalModal() {
            const scorerSelect = document.getElementById('select-scorer');
            const assistSelect = document.getElementById('select-assist');

            const optionsHTML = rosterPlayers.map(
                p => `<option value="${p.jersey}">#${p.jersey} - ${p.name} (${p.position || 'Player'})</option>`
            ).join('');

            scorerSelect.innerHTML = optionsHTML;
            assistSelect.innerHTML = `<option value="">-- Unassisted / None --</option>` + optionsHTML;

            document.getElementById('goal-modal').classList.remove('hidden');
        }

        function closeGoalModal() {
            document.getElementById('goal-modal').classList.add('hidden');
        }

        function confirmRockiesGoal() {
            const scorerJersey = parseInt(document.getElementById('select-scorer').value, 10);
            const assistVal = document.getElementById('select-assist').value;
            const assistJersey = assistVal ? parseInt(assistVal, 10) : null;

            const scorer = rosterPlayers.find(p => p.jersey === scorerJersey);
            const assister = assistJersey ? rosterPlayers.find(p => p.jersey === assistJersey) : null;

            if (!scorer) return;

            // Update match score & player stats
            matchState.usScore++;
            playerStats[scorerJersey].goals++;

            let eventDescription = `⚽ GOAL! #${scorer.jersey} ${scorer.name}`;
            if (assister && assister.jersey !== scorer.jersey) {
                playerStats[assister.jersey].assists++;
                eventDescription += ` (Assist: #${assister.jersey} ${assister.name})`;
            } else {
                eventDescription += ` (Unassisted)`;
            }

            matchState.events.unshift({
                id: Date.now(),
                timeStr: formatTime(matchState.secondsElapsed),
                period: matchState.period,
                type: 'us',
                scorerJersey: scorer.jersey,
                assistJersey: assister && assister.jersey !== scorer.jersey ? assister.jersey : null,
                text: eventDescription
            });

            closeGoalModal();
            renderMatchTracker();
            displayRoster();
        }

        function recordOpponentGoal(delta) {
            if (delta < 0 && matchState.themScore <= 0) return;
            matchState.themScore = Math.max(0, matchState.themScore + delta);

            if (delta > 0) {
                matchState.events.unshift({
                    id: Date.now(),
                    timeStr: formatTime(matchState.secondsElapsed),
                    period: matchState.period,
                    type: 'them',
                    scorerJersey: null,
                    assistJersey: null,
                    text: `🥅 Goal scored by ${matchState.opponentName}`
                });
            }
            renderMatchTracker();
            displayRoster();
        }

        function deleteMatchEvent(eventId) {
            const idx = matchState.events.findIndex(e => e.id === eventId);
            if (idx === -1) return;

            const ev = matchState.events[idx];
            if (ev.type === 'us') {
                matchState.usScore = Math.max(0, matchState.usScore - 1);
                if (ev.scorerJersey && playerStats[ev.scorerJersey]) {
                    playerStats[ev.scorerJersey].goals = Math.max(0, playerStats[ev.scorerJersey].goals - 1);
                }
                if (ev.assistJersey && playerStats[ev.assistJersey]) {
                    playerStats[ev.assistJersey].assists = Math.max(0, playerStats[ev.assistJersey].assists - 1);
                }
            } else if (ev.type === 'them') {
                matchState.themScore = Math.max(0, matchState.themScore - 1);
            }

            matchState.events.splice(idx, 1);
            renderMatchTracker();
            displayRoster();
        }

        function renderMatchTracker() {
            document.getElementById('score-us').textContent = matchState.usScore;
            document.getElementById('score-them').textContent = matchState.themScore;
            document.getElementById('score-them-label').textContent = matchState.opponentName;

            const listEl = document.getElementById('match-events-list');
            if (matchState.events.length === 0) {
                listEl.innerHTML = `
                    <p class="text-sm text-gray-500 italic py-4 text-center">
                        No goals recorded yet. Start the clock and tap "+ Record Rockies Goal" when Albion 14 scores!
                    </p>
                `;
                return;
            }

            listEl.innerHTML = matchState.events.map(ev => `
                <div class="flex items-center justify-between px-4 py-3 rounded-xl border ${ev.type === 'us' ? 'bg-rockies-blue/20 border-rockies-blue/60' : 'bg-zinc-800/70 border-zinc-700'}">
                    <div class="flex items-center space-x-3">
                        <span class="px-2.5 py-1 rounded-md bg-black/50 font-mono text-xs font-bold text-blue-300">
                            ${ev.timeStr} • ${ev.period}
                        </span>
                        <span class="text-sm font-semibold text-white">${ev.text}</span>
                    </div>
                    <button onclick="deleteMatchEvent(${ev.id})" class="text-xs text-gray-400 hover:text-rose-400 font-semibold ml-3" title="Undo / Remove Event">
                        Undo
                    </button>
                </div>
            `).join('');
        }

        // Custom Confirmation Modal Helpers
        function openConfirmModal(title, message, onConfirm) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            const yesBtn = document.getElementById('confirm-yes-btn');
            yesBtn.onclick = () => {
                onConfirm();
                closeConfirmModal();
            };
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
        }

        function resetClockConfirm() {
            openConfirmModal(
                'Reset Match Clock?',
                'This will reset the timer back to 00:00.',
                () => {
                    if (matchState.isRunning) toggleTimer();
                    matchState.secondsElapsed = 0;
                    updateClockUI();
                }
            );
        }

        function resetNewMatchConfirm() {
            openConfirmModal(
                'Start a New Match?',
                'This will reset the current match scoreboard and clock to 0-0 while keeping all players\' accumulated season goals and assists.',
                () => {
                    if (matchState.isRunning) toggleTimer();
                    matchState.secondsElapsed = 0;
                    matchState.usScore = 0;
                    matchState.themScore = 0;
                    matchState.events = [];
                    updateClockUI();
                    renderMatchTracker();
                    displayRoster();
                }
            );
        }

        // Initialize the page when the DOM loads
        document.addEventListener('DOMContentLoaded', () => {
            rosterPlayers = parseCSV(csvData);
            displayRoster();
            renderMatchTracker();
            updateClockUI();
        });
    </script>
</body>
</html>
